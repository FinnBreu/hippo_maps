# RGB components and Foxglove alpha are integers from 0 to 255.
# viewer_alpha is a fraction from 0 to 1; unknown is shown only with
# view_occupancy_grid --show-unknown. Free cells are omitted by that viewer.
unknown:
  rgb: [158, 158, 158]
  foxglove_alpha: 0
  viewer_alpha: 0.75
free:
  rgb: [0, 0, 0]
  foxglove_alpha: 0
  viewer_alpha: 0.0
occupied:
  rgb: [229, 57, 53]
  foxglove_alpha: 150
  viewer_alpha: 0.75
